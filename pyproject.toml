[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mef"
version = "1.0.0"
description = "What prediction markets' expected company figures are worth to stock investors. Research prototype, not investment advice."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["exchange-calendars>=4.13,<5", "pypdf[crypto]>=5,<7"]

[project.scripts]
mef = "mef.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82", "F401", "F841"]
